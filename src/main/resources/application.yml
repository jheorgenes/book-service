#        sliding-window-size: 10
#        # Porcentagem de chamadas que podem falhar
#        failure-rate-threshold: 50
#        # Quando reaberto, espera 10 segundos antes de testar novamente
#        wait-duration-in-open-state: 10s
#        # Libera 3 chamadas novas. Se obter sucesso, FECHA o circuit Breaker. Se falharem, ABRE novamente.
#        permitted-number-of-calls-in-half-open-state: 3
