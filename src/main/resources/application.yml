server:
  port: 8100
# Habilitando o eureka client e registrando-se no servidor Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
# Habilitando o resilience4j para quantidade de tentativas antes de falhar
resilience4j:
  # Controla quantas requisições entram por unidade de tempo. (Só passa duas requisições a cada 10 segundos, pra evitar sobrecarga)
  ratelimiter:
    instances:
      default:
        limit-for-period: 2
        limit-refresh-period: 10s
  # Controla quantas requisições estão sendo processadas simultaneamente.
  bulkhead:
    instances:
      default:
        # 10 chamadas executando ao mesmo tempo
        max-concurrent-calls: 10
      foo-bar:
        max-concurrent-calls: 20
  # Repete as requisições até a quantidade estipulada, antes de falhar completamente
  retry:
    instances:
      foo-bar:
        # Quantidade de requisições
        max-attempts: 7
        # Tempo de espera entre cada requisição
        wait-duration: 1s
        # Adiciona o intervalo de tempo em exponencial
        enable-exponential-backoff: true
